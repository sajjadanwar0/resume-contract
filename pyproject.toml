[project]
name = "resume-contract"
version = "0.1.0"
description = "Resume Contract: conformance harness, archaeology tooling, and workspace glue. Framework environments are pinned separately under envs/ (one env = one matrix cell)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness/conformance"]

[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true