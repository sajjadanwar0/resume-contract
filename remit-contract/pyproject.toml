[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "remit-contract"
version = "0.1.2"
description = "REMIT: Rust-core enforcement of the Resume Contract (PC/EO/FD/CV/CO/RD) for LLM-agent checkpoint, interrupt, and resume semantics, with a decision-free LangGraph checkpointer shim. Companion artifact of the paper 'Resume Means Resume'."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sajjad Khan", email = "sajjadanwar200@gmail.com" }]
keywords = [
  "llm-agents", "langgraph", "checkpoint", "resume", "interrupt",
  "exactly-once", "formal-verification", "verus", "tla-plus", "rust", "pyo3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Repository = "https://github.com/sajjadanwar0/remit-contract"
Paper-Artifact = "https://github.com/sajjadanwar0/resume-contract-paper"

[project.optional-dependencies]
langgraph = ["langgraph>=1.0", "langgraph-checkpoint>=4.0"]
sqlite = ["langgraph-checkpoint-sqlite>=3.0"]
test = ["pytest>=8"]

[tool.maturin]
include = [
  { path = "LICENSE", format = "sdist" },
  { path = "VERIFICATION.md", format = "sdist" },
  { path = "tests/*", format = "sdist" },
]
python-source = "python"
module-name = "remit._core"
manifest-path = "crates/remit-py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
